# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Core :: Privacy: Anti-Tracking'

image_input:
  offered:
    type: event
    description: >
      Recorded once for each image file the user makes available to a web page,
      at the moment it is handed over rather than when it is uploaded: choosing
      files in a file or folder picker, dropping them onto the page, or pasting
      them. That is the point at which page script gains read access to the
      file, which may be earlier than, or instead of, any network request.

      Not recorded for system principals or about: pages. Not recorded either
      for a folder dropped onto the page itself rather than onto a file input:
      the page receives one directory entry and walks it with
      webkitGetAsEntry, and the files it finds that way never pass through
      here. The same folder chosen in the folder picker, or dropped onto an
      input with webkitdirectory, records every file.

      Only the first few files of any one selection have their bytes read; the
      rest are recorded with scan_outcome = skipped_batch_limit. A selection
      also produces at most 32 events, and files past that produce no event at
      all. The true number of candidate files is recorded separately as
      image_input.batch_size, which is where those files stay visible.

      has_gps = "false" is a LOWER BOUND on how many uploads carry location.
      Location held in XMP, in a MakerNote, in an Android Motion Photo's
      appended MP4 or in an MPF secondary image is not detected, nor are the
      GPSDest tags, which record where the camera was headed rather than where
      it stood. Neither is location in HEIF/HEIC, AVIF or JPEG XL, which report
      scan_outcome = unsupported_container, nor in an image the platform held
      as pixels rather than as a file, which reports skipped_bitmap.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058913
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058913
    data_sensitivity:
      - interaction
      - technical
    notification_emails:
      - privacy-team@mozilla.org
    expires: 174
    extra_keys:
      input_type:
        description: >
          How the file reached the page. One of "file_picker",
          "directory_picker", "drop", "paste".
        type: string
      detected_format:
        description: >
          The container format determined from the file's leading bytes, rather
          than from what the platform claimed. One of "jpeg", "png", "tiff",
          "bigtiff", "webp", "heif", "avif", "gif", "bmp", "jxl", "svg",
          "unknown", or "not_scanned" when no bytes were read.
        type: string
      has_gps:
        description: >
          Whether the EXIF metadata can say where the image was captured.
          "true" means latitude and longitude are both present and usable.
          "ifd_only" means a GPS attribute IFD exists but carries no usable
          position, which is what a partially stripped file looks like.
          "false" means there is no GPS metadata. "unknown" means we could not
          determine it; see scan_outcome.

          The coordinates themselves are never retained or reported. Collapse
          "ifd_only" into "false" for a simple yes or no rate.
        type: string
      scan_outcome:
        description: >
          Why has_gps holds the value it does. One of "ok", "no_exif",
          "unsupported_container", "malformed_container",
          "unsupported_exif_encoding", "exif_truncated",
          "exif_location_unknown", "read_error", "skipped_batch_limit",
          "skipped_bitmap", "skipped_empty_file", "skipped_parent_process".

          has_gps = "true" is authoritative under every outcome, because a
          position that has been found cannot be un-found by reading further.
          has_gps = "false" and "ifd_only" are only authoritative for "ok" and
          "no_exif".

          "skipped_bitmap" is an image the platform holds as pixels rather than
          as a file, typically a screenshot pasted from the clipboard. It is
          counted but never read: producing the file the page sees means
          decoding and re-encoding the image synchronously on the main thread,
          and what comes out is the encoder's output, not any original file.

          "skipped_parent_process" is expected to be zero, because web content
          is always out of process and extension pages are not recorded at all.
          A non-zero count is not a bucket to fold into the totals: it means
          some path reached the probe from the parent process, and the events
          are therefore undercounting.
        type: string

  batch_size:
    type: custom_distribution
    description: >
      The number of candidate image files in a single user selection, counted
      before any per-selection cap is applied. Recorded once per selection, so
      that the total number of images handed to web pages stays countable even
      when the per-file image_input.offered events are truncated by the cap.

      The two cannot be joined per selection: this is a distribution in the
      metrics ping, while image_input.offered is an event in the events ping.
      Reconcile them by comparing this metric's sum against the count of those
      events, which holds at population scale but not for one selection. The
      count falls short of the sum by every file past the 32-event ceiling,
      so the shortfall sits entirely in large selections rather than being
      spread evenly. The sum is exact even for a selection large enough to
      overflow the top bucket.

      The bucket boundaries fall on 9 and 33, so both per-selection caps are
      exactly readable rather than straddled: a selection of 9 or more files
      had at least one file go unscanned, and one of 33 or more had at least
      one file produce no event at all.
    range_min: 1
    range_max: 65536
    bucket_count: 49
    histogram_type: exponential
    unit: files
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058913
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2058913
    data_sensitivity:
      - interaction
    notification_emails:
      - privacy-team@mozilla.org
    expires: 174
