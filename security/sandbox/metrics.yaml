# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Core :: Security: Process Sandboxing'

sandbox:
  rejected_syscalls:
    type: labeled_counter
    description: >
      System calls blocked by a seccomp-bpf sandbox policy; limited to syscalls
      where we would crash on Nightly.  The key is generally the architecture
      and syscall ID but in some cases we include non-personally-identifying
      information from the syscall arguments; see the function SubmitToTelemetry
      in security/sandbox/linux/reporter/SandboxReporter.cpp for details.

      This metric was generated to correspond to the Legacy Telemetry count
      histogram SANDBOX_REJECTED_SYSCALLS.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1286865
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1286865
    notification_emails:
      - jld@mozilla.com
      - gcp@mozilla.com
    expires: never

  launch_attempts:
    type: labeled_counter
    description: >
      Number of attempts to launch a Windows sandboxed process that reach the
      sandbox broker's SpawnTarget, labeled by the kind of sandbox policy
      applied. Labels start with the process type, followed by the sandbox
      kind where the process type has more than one, for example
      "utility.generic".
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2091459
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2091459
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: never
    labels: &sandbox_kind_labels
      - tab.default
      - tab.file
      - gpu
      - rdd
      - gmplugin.default
      - gmplugin.widevine
      - gmplugin.clearkey
      - gmplugin.fake
      - utility.generic
      - utility.audio_decoding_wmf
      - utility.mf_media_engine_cdm
      - utility.windows_utils
      - utility.windows_file_dialog
      - utility.pkcs11_module
      - utility.hw_inference

  launch_failures:
    type: labeled_counter
    description: >
      Number of attempts to launch a Windows sandboxed process that reach the
      sandbox broker's SpawnTarget and fail, labeled the same way as
      launch_attempts.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2091459
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2091459
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: never
    labels: *sandbox_kind_labels

  launch_failed:
    type: event
    description: >
      A Windows sandboxed process failed to launch. Recorded at most once per
      application lifetime for each combination of sandbox kind, result code
      and Windows error code.
    extra_keys:
      sandbox_kind:
        description: >
          The kind of sandbox policy applied, as used for the launch_attempts
          labels, for example "utility.generic".
        type: string
      result_code:
        description: >
          The sandbox::ResultCode returned by SpawnTarget, see
          security/sandbox/chromium/sandbox/win/src/sandbox_types.h.
        type: quantity
      win32_error:
        description: >
          The Windows error code associated with the failure, 0 if the failure
          was not caused by a Windows API call.
        type: quantity
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2091459
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2091459
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: never

  effective_content_process_level:
    type: quantity
    unit: level
    lifetime: application
    description: |
      The current sandbox level.
      The "security.sandbox.content.level" preference rounded up to the current minimum allowed level.
      0 if `MOZ_DISABLE_CONTENT_SANDBOX` is set.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: never

  content_win32k_lockdown_state:
    type: quantity
    unit: lockdown state
    lifetime: application
    description: |
      The current win32k.sys lockdown state.
      Possible values are defined in the ContentWin32kLockdownState enum.
      Reported even on non-Windows machines.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: never
