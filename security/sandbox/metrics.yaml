# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Core :: Security: Process Sandboxing'

sandbox:
  rejected_syscalls:
    type: labeled_counter
    description: >
      System calls blocked by a seccomp-bpf sandbox policy; limited to syscalls
      where we would crash on Nightly.  The key is generally the architecture
      and syscall ID but in some cases we include non-personally-identifying
      information from the syscall arguments; see the function SubmitToTelemetry
      in security/sandbox/linux/reporter/SandboxReporter.cpp for details.

      This metric was generated to correspond to the Legacy Telemetry count
      histogram SANDBOX_REJECTED_SYSCALLS.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1286865
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1286865
    notification_emails:
      - jld@mozilla.com
      - gcp@mozilla.com
    expires: never

  failed_launch_keyed:
    type: labeled_custom_distribution
    description: |
      Error code when a Windows sandboxed process fails to launch, keyed by process type and Windows error code. See https://searchfox.org/mozilla-central/search?q=ResultCode++path%3Asandbox_types.h&redirect=true for definitions of the error codes.
    range_min: 0
    range_max: 50
    bucket_count: 51
    histogram_type: linear
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1368600
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1368600
    notification_emails:
      - bowen@mozilla.com
    expires: never

  effective_content_process_level:
    type: quantity
    unit: level
    lifetime: application
    description: |
      The current sandbox level.
      The "security.sandbox.content.level" preference rounded up to the current minimum allowed level.
      0 if `MOZ_DISABLE_CONTENT_SANDBOX` is set.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: never

  content_win32k_lockdown_state:
    type: quantity
    unit: lockdown state
    lifetime: application
    description: |
      The current win32k.sys lockdown state.
      Possible values are defined in the ContentWin32kLockdownState enum.
      Reported even on non-Windows machines.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1950398
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: never

  font_file_allowed:
    type: boolean
    lifetime: application
    description: |
      Set to true the first time the Windows sandbox broker allows access to a
      font file, because it is in the set of installed font file paths.
      Font files in the standard system and per-user Fonts directories are
      allowed by other rules and are not counted. Not set otherwise.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097719
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097719
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: 189

  font_file_denied:
    type: boolean
    lifetime: application
    description: |
      Set to true the first time the Windows sandbox broker denies access to a
      path with a font file extension, because it is not in the set of
      installed font file paths, including after waiting for the set to be
      rebuilt. Font files in the standard system and per-user Fonts directories
      are allowed by other rules and are not counted. Not set otherwise.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097719
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2097719
    data_sensitivity:
      - technical
    notification_emails:
      - bowen@mozilla.com
    expires: 189
