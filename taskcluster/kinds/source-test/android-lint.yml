---
task-defaults:
    description: 'Run lint over all modules'
    worker:
        max-run-time: 2700
        docker-image: {in-tree: lint}
    always-target: false
    attributes:
        build_platform: android
        code-review: true
    fetches:
        toolchain:
            - android-sdk-linux
            - linux64-embedded-uniffi-bindgen
            - linux64-nimbus-fml
            - android-gradle-dependencies
            - linux64-jdk-repack
    platform: 'lint/opt'
    treeherder:
        kind: test
        tier: 1
    worker-type: b-linux
    when:
        files-changed:
            - "mobile/android/android-components/**"


android-components:
    run:
        using: gradlew
        pre-gradlew:
            - ["cd", "mobile/android/android-components"]
        gradlew: ['lint', "--no-parallel"]
    dependencies:
        build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
    fetches:
        build-fat-aar:
            - target.maven.zip
    treeherder:
        symbol: lint(AC)
    worker:
        artifacts:
            - name: public/reports
              path: /builds/worker/checkouts/gecko/mobile/android/android-components/build/reports
              type: directory

focus:
    when:
        files-changed:
            - "mobile/android/focus-android/**"
            - "mobile/android/shared-lint.xml"
    run:
        using: gradlew
        pre-gradlew:
            - ["cd", "mobile/android/focus-android"]
        gradlew: ['lint']
    dependencies:
        build-fat-aar: build-fat-aar-android-geckoview-fat-aar/opt
    fetches:
        build-fat-aar:
            - target.maven.zip
    treeherder:
        symbol: lint(focus)
    worker:
        artifacts:
            - name: public/reports
              path: /builds/worker/checkouts/gecko/mobile/android/focus-android/build/reports
              type: directory

fenix:
    when:
        files-changed:
            - "mobile/android/fenix/**"
            - "mobile/android/shared-lint.xml"
    run:
        using: mach-gradle
        gradle-project: "."
        mach-build-exports: true
        gradle-args:
            - "-Pandroid-lint"
            - "-PdisableAndroidComponentsTasks=true"
            - ":fenix:lintDebug"
    treeherder:
        symbol: lint(fenix)
    worker:
        artifacts:
            - name: public/reports
              path: /builds/worker/checkouts/gecko/mobile/android/fenix/build/reports
              type: directory
