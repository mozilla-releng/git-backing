---
diff: &diff
    description: Generates diffs of CI changes
    platform: linux
    worker-type: t-linux-docker-amd
    worker:
        docker-image: {in-tree: "lint"}
        max-run-time: 2400
        env:
            TASKGRAPH_SERIAL: "1"
        # Uncomment to upload logs of the generations as artifacts.
        #     XDG_CACHE_HOME: "/builds/worker/artifacts/cache"
        artifacts:
            - type: directory
              name: public/taskgraph
              path: /builds/worker/artifacts
    attributes:
        code-review: true
    always-target: true
    treeherder:
        kind: test
        platform: gecko-decision/opt
        symbol: tgdiff
        tier: 2
    task-context:
        from-parameters:
            base_rev: base_rev
        substitution-fields:
            - run.command
    run-on-repo-type: [hg]
    run:
        clone-with: hg
        using: run-task
        cwd: '{checkout}'
        command: >-
            mkdir -p /builds/worker/artifacts/diffs &&
            ./mach taskgraph target --fast -p "taskcluster/test/params" --force-local-files-changed -o "/builds/worker/artifacts/diffs/diff.txt" --diff {base_rev} &&
            python taskcluster/scripts/misc/summarize-tgdiff.py /builds/worker/artifacts/diffs/ 20
    when:
        files-changed:
            - 'taskcluster/kinds/**'
            - 'taskcluster/**/*.py'
            - 'taskcluster/requirements.txt'

diff-par: &diff-par
    <<: *diff
    worker:
        docker-image: {in-tree: "lint"}
        max-run-time: 2400
        env:
            TASKGRAPH_SERIAL: ""
        artifacts:
            - type: directory
              name: public/taskgraph
              path: /builds/worker/artifacts
    treeherder:
        kind: test
        platform: gecko-decision/opt
        symbol: tgdiffP
        tier: 2

diff-par-16c:
    <<: *diff-par
    worker-type: t-linux-docker-16c32gb-amd
    treeherder:
        kind: test
        platform: gecko-decision/opt
        symbol: tgdiffP16
        tier: 2

diff-par-b16c:
    <<: *diff-par
    worker-type: b-linux-docker-amd
    treeherder:
        kind: test
        platform: gecko-decision/opt
        symbol: tgdiffPB16
        tier: 2

diff-par-b30c:
    <<: *diff-par
    worker-type: b-linux-docker-large-amd
    treeherder:
        kind: test
        platform: gecko-decision/opt
        symbol: tgdiffPB30
        tier: 2

diff-par-b60c:
    <<: *diff-par
    worker-type: b-linux-docker-xlarge-amd
    treeherder:
