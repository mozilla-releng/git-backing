---
task-defaults:
    run-on-projects: ["trunk"]
    platform: linux64/debug
    worker-type: t-linux-docker-amd
    attributes:
        code-review: true
    worker:
        docker-image: {in-tree: static-analysis-build}
        max-run-time: 5400
    treeherder:
        kind: other
        tier: 2
    run:
        clone-with: hg
        using: run-task
        tooltool-downloads: public
    fetches:
        toolchain:
            - linux64-cbindgen
            - linux64-nasm
            - linux64-node
    when:
        files-changed:
            - '**/*.c'
            - '**/*.cpp'
            - '**/*.cc'
            - '**/*.cxx'
            - '**/*.m'
            - '**/*.mm'
            - 'tools/clang-tidy/**'

tidy: &tidy
    description: Run static-analysis (clang-tidy) on C/C++ patches
    worker-type: t-linux-docker-large-amd
    treeherder:
        symbol: cpp(clang-tidy)
    run:
        cwd: '{checkout}'
        command: >-
            source taskcluster/scripts/misc/source-test-clang-setup.sh &&
            ./mach --log-no-times static-analysis check --outgoing --output $HOME/clang-tidy.json --format json
    fetches:
        toolchain:
            - linux64-clang
            - linux64-clang-tidy
            - linux64-rust
            - sysroot-x86_64-linux-gnu
            - sysroot-wasm32-wasi
    worker:
        artifacts:
            - type: file
              name: public/code-review/clang-tidy.json
              path: /builds/worker/clang-tidy.json
            - type: file
              name: public/profile_resource-usage.json
              path: /builds/worker/profile_resource-usage.json

external: &external
    description: Run static-analysis (clang-tidy) on C/C++ patches with external checks
    worker-type: t-linux-docker-large-amd
    treeherder:
        symbol: cpp(clang-tidy-external)
    attributes:
        code-review:
            # This task has a dependency that requires a secret and shouldn't
            # run in L1 contexts. We exclude try to preserve backwards
            # compatibility and because reviewbot is already restricted to
            # trusted contributors there.
            by-project:
                try: true
                default:
                    by-level:
                        "1": false
                        default: true
    run:
        cwd: '{checkout}'
        command: >-
            source taskcluster/scripts/misc/source-test-clang-setup.sh &&
            ./mach --log-no-times static-analysis check --checks="-*,mozilla-civet-*" --outgoing --output $HOME/clang-tidy.json --format json
    fetches:
        toolchain:
            - linux64-clang
            - linux64-clang-tidy-external
            - linux64-rust
            - sysroot-x86_64-linux-gnu
            - sysroot-wasm32-wasi
    worker:
        artifacts:
            - type: file
              name: public/code-review/clang-tidy.json
              path: /builds/worker/clang-tidy.json
            - type: file
              name: public/profile_resource-usage.json
              path: /builds/worker/profile_resource-usage.json

tidy-16c:
    <<: *tidy
    worker-type: t-linux-docker-16c32gb-amd
    treeherder:
        symbol: cpp(clang-tidy16)

tidy-b16c:
    <<: *tidy
    worker-type: b-linux-docker-amd
    treeherder:
        symbol: cpp(clang-tidyB16)

tidy-b30c:
    <<: *tidy
    worker-type: b-linux-docker-large-amd
    treeherder:
        symbol: cpp(clang-tidyB30)

tidy-b60c:
    <<: *tidy
    worker-type: b-linux-docker-xlarge-amd
    treeherder:
        symbol: cpp(clang-tidyB60)

external-16c:
    <<: *external
    worker-type: t-linux-docker-16c32gb-amd
    treeherder:
        symbol: cpp(clang-tidy-external16)

external-b16c:
    <<: *external
    worker-type: b-linux-docker-amd
    treeherder:
        symbol: cpp(clang-tidy-externalB16)

external-b30c:
    <<: *external
    worker-type: b-linux-docker-large-amd
    treeherder:
        symbol: cpp(clang-tidy-externalB30)

external-b60c:
    <<: *external
    worker-type: b-linux-docker-xlarge-amd
    treeherder:
        symbol: cpp(clang-tidy-externalB60)

unittest:
    description: Ensure static analysis works correctly
    treeherder:
        symbol: cpp(clang-tidy-unittest)
    attributes:
        code-review: false
    when:
        files-changed:
            - 'config/mozunit/**'
            - 'python/mach_commands.py'
            - 'python/mach/**'
            - 'python/mozbuild/mozbuild/code_analysis/mach_commands.py'
            - 'taskcluster/scripts/misc/source-test-clang-setup.sh'
            - 'tools/clang-tidy/**'
    run:
        cwd: '{checkout}'
        command: >-
            source taskcluster/scripts/misc/source-test-clang-setup.sh &&
            ./mach --log-no-times static-analysis unittest

    fetches:
        toolchain:
            - linux64-clang
            - linux64-clang-tidy
            - linux64-rust
            - sysroot-x86_64-linux-gnu
            - sysroot-wasm32-wasi
