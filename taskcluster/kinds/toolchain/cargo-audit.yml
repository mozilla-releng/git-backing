---
task-defaults:
    description: "cargo-audit toolchain build"
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        script: build-rust-based-toolchain.sh
        toolchain-artifact: public/build/cargo-audit.tar.zst
    fetches:
        fetch:
            - cargo-audit

linux64-cargo-audit:
    treeherder:
        symbol: TL(cargo-audit)
    run:
        arguments: ['x86_64-unknown-linux-gnu']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-toolchain
            - linux64-toolchain-sysroot
