# All fields are mandatory unless otherwise noted

schema: 1
# Version of this schema

bugzilla:
  # Bugzilla product and component for this directory and subdirectories.
  product: Thunderbird
  component: General

origin:
  name: zip.js
  description: JavaScript library to zip and unzip files, supporting ZIP64
  url: https://gildas-lormeau.github.io/zip.js/

  release: v2.23.0 (2026-10-03T04:51:02+02:00)
  # Human-readable identifier for this version/release
  # Generally "version NNN", "tag SSS", "bookmark SSS"

  revision: a6ba5033db457d5c97b39c32c338894bd5726132
  # Revision to pull in
  # Must be a long or short commit SHA (long preferred)

  license: BSD-3-Clause
  license-file: LICENSE

vendoring:
  # Information needed to update the library automatically.

  url: https://github.com/gildas-lormeau/zip.js
  source-hosting: github
  tracking: tag

  skip-vendoring-steps:
    - hg-add
    - spurious-check
    - update-moz-build

  # Only the ES module sources reachable from lib/zip-core-custom.js are kept.
  # That entry point has no fallback codecs and no web worker backend: deflate
  # goes through Gecko's own CompressionStream and DecompressionStream, which
  # zip.js only uses for compression level 6 (the default) and for reading.
  exclude:
    - '**'

  include:
    - LICENSE
    - README.md
    - package.json
    - lib/core/codec-pool.js
    - lib/core/codec-registry.js
    - lib/core/codec-worker-web.js
    - lib/core/codec-worker.js
    - lib/core/compression-methods.js
    - lib/core/configuration.js
    - lib/core/constants.js
    - lib/core/io.js
    - lib/core/options.js
    - lib/core/streams/aes-crypto-stream.js
    - lib/core/streams/codec-stream.js
    - lib/core/streams/codecs/aes-hmac-sha1.js
    - lib/core/streams/codecs/crc32.js
    - lib/core/streams/common-crypto.js
    - lib/core/streams/crc32-stream.js
    - lib/core/streams/zip-crypto-stream.js
    - lib/core/streams/zip-entry-stream.js
    - lib/core/util/array.js
    - lib/core/util/blob-temp-stream.js
    - lib/core/util/compatible-streams.js
    - lib/core/util/decode-cp437.js
    - lib/core/util/decode-text.js
    - lib/core/util/default-mime-type.js
    - lib/core/util/encode-text.js
    - lib/core/util/error.js
    - lib/core/util/opfs-temp-stream.js
    - lib/core/util/sync-access-handle-temp-stream.js
    - lib/core/util/warnings.js
    - lib/core/version.js
    - lib/core/zip-entry.js
    - lib/core/zip-reader.js
    - lib/core/zip-writer.js
    - lib/zip-core-base.js
    - lib/zip-core-custom.js
    - lib/zip-core-reader.js
    - lib/zip-core-writer.js
