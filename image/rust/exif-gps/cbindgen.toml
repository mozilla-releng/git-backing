header = """/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at http://mozilla.org/MPL/2.0/. */"""
autogen_warning = """/* DO NOT MODIFY THIS MANUALLY! This file was generated using cbindgen. See RunCbindgen.py */
"""
include_version = true
braces = "SameLine"
line_length = 100
tab_width = 2
language = "C++"
namespaces = ["mozilla", "image"]
include_guard = "IMAGE_RUST_EXIFGPSFFI_H_"
includes = ["cstdint", "cstddef"]

[export]
include = [
  "EXIFContainer",
  "EXIFScanOutcome",
  "EXIFGPSPresence",
  "EXIFScanResult",
]

[fn]
rename_args = "None"

# Rust spells these fields in snake_case; the C++ that reads them is Gecko
# style, and keeping the emitted names camelCase is what lets the existing
# consumers stay untouched.
[struct]
rename_fields = "CamelCase"
